name: XP Takip Botu

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrol-et:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri ve tarayıcıyı yükle
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: XP kontrolünü çalıştır
        env:
          NTFY_KANAL_ADI: ${{ secrets.NTFY_KANAL_ADI }}
          NTFY_DIGER_KANAL_ADI: ${{ secrets.NTFY_DIGER_KANAL_ADI }}
        run: python takip.py

      - name: Güncel puanları kaydet
        run: |
          if [ -f puanlar.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add puanlar.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Puanlar güncellendi" && git push)
          fi
